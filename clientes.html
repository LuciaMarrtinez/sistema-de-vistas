<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes | Hotel Booking</title>

    <link rel="stylesheet" href="style.css">
    <script src="clientes.js" defer></script>
</head>
<body>

    <header class="navbar">
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="estadisticas.html" class="nav-link">Estadísticas</a>
            <a href="listados.html" class="nav-link">Listados</a>
            <a href="reservas.html" class="nav-link">Reservas</a>
            <a href="clientes.html" class="nav-link active">Clientes</a>
            <a href="habitaciones.html" class="nav-link">Habitaciones</a>
        </nav>
    </header>

    <main class="container">

        <section class="welcome">
            <h1>Clientes</h1>
            <p>Consultá la información de los clientes registrados.</p>
        </section>

        <section class="card client-search">
            <h2>Buscar clientes</h2>
            <p class="search-description">
            </p>

            <form id="client-search-form">

                <div class="client-search-fields">

                    <div class="filter-field">
                        <label for="client-name">Nombre</label>
                        <input
                            type="text"
                            id="client-name"
                            name="nombre"
                        >
                    </div>

                    <div class="filter-field">
                        <label for="client-surname">Apellido</label>
                        <input
                            type="text"
                            id="client-surname"
                            name="apellido"
                        >
                    </div>

                </div>

                <div class="search-actions">
                    <button type="submit">Buscar</button>

                    <button
                        type="button"
                        id="clear-client-search"
                        class="secondary-button"
                    >
                        Limpiar
                    </button>
                </div>

            </form>
        </section>

        <section class="card client-results">

            <div class="results-header">
                <div>
                    <h2>Listado de clientes</h2>
                </div>

                <span id="client-count" class="results-count">
                    0 clientes
                </span>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                        </tr>
                    </thead>

                    <tbody id="client-table-body">
                        <tr>
                            <td colspan="5" class="empty-message">

                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>

</body>
</html>
